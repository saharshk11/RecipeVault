[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
backend = { path = "../backend" }
recipe-core = { path = "../recipe-core" }
reqwest = { version = "0.12.28", features = ["rustls-tls"] }
serde_json = "1.0.147"
secrecy = "0.10.3"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1.48.0", features = ["full"] }
url = "2.5.7"
